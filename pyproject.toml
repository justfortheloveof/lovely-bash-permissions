[project]
name = "lovely-bash-permissions"
version = "0.1.0"
description = "A Python library for parsing bash commands into structured AST trees using shfmt-py"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["bash", "parser", "ast", "shell", "shfmt", "permissions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Shells",
    "Typing :: Typed",
]
dependencies = [
    "shfmt-py>=4.1.0",
]

[project.scripts]
lovely-bash-inspection = "lovely_bash_permissions.cli:main"
lovely-devin-permissions = "lovely_bash_permissions.devin_cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
    "pytest>=9.1.1",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
extend-select = ["ANN", "E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
markers = [
    "linting: ruff lint and format checks (deselect with '-m not linting')",
]
# -n auto = automatically detect CPU cores and spin up that number of workers
# --dist loadscope = group tests by their class or module
addopts = "-n auto --dist loadscope"
