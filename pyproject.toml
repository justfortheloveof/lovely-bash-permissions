[project]
name = "lovely-bash-permissions"
version = "0.1.0"
description = "A Python library for parsing bash commands into structured AST trees using shfmt-py"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "shfmt-py>=4.1.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
